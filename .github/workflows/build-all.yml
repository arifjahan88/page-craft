name: PageCraft Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          # macOS Apple Silicon
          - name: macOS ARM64
            platform: macos-latest
            args: --target aarch64-apple-darwin

          # macOS Intel
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin

          # Windows x64
          - name: Windows x64
            platform: windows-latest
            args: ""

          # Linux x64
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Linux build dependencies
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: yarn

      # Rust
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Rust compilation cache
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Frontend dependencies
      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # macOS ad-hoc signing for initial unsigned releases
      - name: Set macOS signing identity
        if: runner.os == 'macOS'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"

      # Build and publish
      - name: Build Tauri application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.version || 'v1.0.0' }}
          releaseName: "PageCraft ${{ inputs.version || 'v1.0.0' }}"
          releaseBody: |
            ## PageCraft Desktop Release (${{ inputs.version || 'v1.0.0' }})

            Download the installer for your operating system:
            - **macOS**: `.dmg` (Apple Silicon or Intel)
            - **Windows**: `.exe` / `.msi`
            - **Linux**: `.AppImage` / `.deb`

          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
